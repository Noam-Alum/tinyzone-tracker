name: Update Domains

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-domains
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fetch active domains
        run: npm run fetch

      - name: Update README timestamp
        run: |
          DATE=$(date -u)
          sed -i "s/Last Updated: .*/Last Updated: $DATE/" README.md

      - name: Commit files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update domain list and README timestamp"
          file_pattern: public/data.json README.md
          pull: true
          push_options: --force-with-lease