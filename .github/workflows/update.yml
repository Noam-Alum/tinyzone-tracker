name: Update Domains

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-domains
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- MAIN BRANCH ---
      - name: Checkout main
        uses: actions/checkout@v3
        with:
          ref: main
          path: main

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: main
        run: npm install

      - name: Fetch active domains
        working-directory: main
        run: npm run fetch

      - name: Update README timestamp
        working-directory: main
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          sed -i "s|Last Updated: .*|Last Updated: $DATE  |" README.md

      # --- GH-PAGES BRANCH ---
      - name: Checkout gh-pages
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy JSON to gh-pages root
        run: |
          cp main/public/data.json gh-pages/data.json

      # --- COMMIT gh-pages ---
      - name: Commit JSON to gh-pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: gh-pages
          commit_message: "chore: update domain list"
          file_pattern: data.json
          branch: gh-pages
          skip_dirty_check: false

      # --- COMMIT main ---
      - name: Commit README to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: main
          commit_message: "chore: update README timestamp"
          file_pattern: README.md
          branch: main
          skip_dirty_check: false